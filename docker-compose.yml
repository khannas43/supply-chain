name: supplychain

# Host ports are chosen to avoid other projects on this machine (5173, 5432, 8080, 3001-3003).
# Everything is bound to 127.0.0.1.
services:
  db:
    build: ./db
    image: supplychain-db:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supplychain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-supplychain}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    image: supplychain-api:dev
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supplychain}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-supplychain}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-supplychain}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8180/realms/supplychain}
      EVIDENCE_DIR: /data/evidence
      AUTH_MODE: ${AUTH_MODE:-keycloak}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-supplychain-web}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-supplychain-api}
    volumes:
      - evidence:/data/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Sign-in. Imports the `supplychain` realm on first start; keycloak-setup then gives the seed users a password.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # the address browsers use; the API reaches Keycloak at http://keycloak:8080 inside the network
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak/supplychain-realm.json:/opt/keycloak/data/import/supplychain-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8180:8080"
    restart: unless-stopped

  # Runs once per `docker compose up`: installs the realm if it is missing and sets a password for any
  # seed user who has none. Safe to repeat; it never overwrites a password that was changed.
  keycloak-setup:
    image: python:3.12-slim
    command: ["python", "/keycloak/setup.py", "--url", "http://keycloak:8080", "--wait", "240"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in .env}
    volumes:
      - ./keycloak:/keycloak:ro
    depends_on:
      - keycloak
    restart: "no"

  # Consumes the outbox: parses, validates and processes collected payloads, applies the published
  # rules and raises alerts. Same image as the API.
  worker:
    image: supplychain-api:dev
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supplychain}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-supplychain}
      EVIDENCE_DIR: /data/evidence
    volumes:
      - evidence:/data/evidence
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    image: supplychain-web:dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8095}:80"
    restart: unless-stopped

volumes:
  pgdata:
  evidence:
  keycloak_data:
