# One local origin: static frontend plus the API under /api.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Correlation ID on every request, passed to the API and returned to the caller.
    add_header X-Request-ID $request_id always;

    # Docker's DNS, asked again every few seconds. With a fixed hostname nginx would remember the API's
    # address from startup and answer 502 for ever once the API container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Request-ID $request_id always;
    }

    location / {
        try_files $uri /index.html;
    }
}
